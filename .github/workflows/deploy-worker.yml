# Deploys the checkout Worker to Cloudflare whenever worker code changes on main.
# Needs two GitHub repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Runs the tests first; if any fail, nothing is deployed.
# Existing dashboard secrets, variables and the KV binding are carried over ("inherit"), never overwritten.
name: Deploy Worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Worker tests
        run: node worker/test.mjs | tee /tmp/test.out; ! grep -q "^FAIL\|^FAILED" /tmp/test.out

      - name: Build upload files
        run: |
          # same transformation used for the dashboard paste copy
          sed -E 's/^export (async )?function /\1function /' worker/worker.js > /tmp/worker.js
          grep -q "export default" /tmp/worker.js
          cat > /tmp/metadata.json <<'JSON'
          {
            "main_module": "worker.js",
            "compatibility_date": "2024-10-01",
            "bindings": [
              {"type": "inherit", "name": "ORDERS_KV"},
              {"type": "inherit", "name": "SQUARE_ACCESS_TOKEN"},
              {"type": "inherit", "name": "SQUARE_LOCATION_ID"},
              {"type": "inherit", "name": "SQUARE_ENV"},
              {"type": "inherit", "name": "SQUARE_WEBHOOK_SIGNATURE_KEY"},
              {"type": "inherit", "name": "RESEND_API_KEY"},
              {"type": "inherit", "name": "NOTIFY_TO"},
              {"type": "inherit", "name": "NOTIFY_FROM"},
              {"type": "inherit", "name": "CUSTOMER_FROM"},
              {"type": "inherit", "name": "WEBHOOK_URL"},
              {"type": "inherit", "name": "FULFILLMENT_MODE"},
              {"type": "inherit", "name": "SQUARE_TAX_NAME"},
              {"type": "inherit", "name": "REQUIRE_TAX"},
              {"type": "inherit", "name": "SITE_URL"},
              {"type": "inherit", "name": "ALLOWED_ORIGINS"}
            ]
          }
          JSON

      - name: Upload to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Cloudflare secrets are not set yet, so nothing was deployed. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the repo's Settings > Secrets and variables > Actions."
            exit 0
          fi
          curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/mtd-checkout" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F 'metadata=@/tmp/metadata.json;type=application/json' \
            -F 'worker.js=@/tmp/worker.js;filename=worker.js;type=application/javascript+module' \
            -o /tmp/resp.json -w "HTTP %{http_code}\n"
          cat /tmp/resp.json | head -c 1500; echo
          grep -q '"success": *true' /tmp/resp.json
